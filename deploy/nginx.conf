# /etc/nginx/sites-available/erp-netorodas
server {
    listen 80;
    server_name erp-netorodas.online;
    root /var/www/erp-netorodas/public;
    index index.php;
    client_max_body_size 4M;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Uploads sao somente imagens: nunca executar PHP ali.
    location ^~ /uploads/ { location ~ \.php$ { return 403; } }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ /\.(?!well-known) { deny all; }
}
# Depois: certbot --nginx -d erp-netorodas.online
